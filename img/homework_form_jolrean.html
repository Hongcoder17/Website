<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      button {
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <h2>
      <center>ទម្រង់ចុះឈ្មោះចូលរៀន</center>
    </h2>
    <form>
      <div>
        <input type="radio" name="time" value="វេនសិក្សា" checked />
        <label for="lang">វេនព្រឹក</label>
        <input type="radio" name="time" value="វេនសិក្សា" />
        <label for="lang">វេនរសៀល</label>
        <input type="radio" name="time" value="វេនសិក្សា" />
        <label for="lang">វេនយប់</label>
      </div>
      <caption>
        ជ្រើសរើសជំនាញឯកទេស
      </caption>
    </form>
    <form>
      <div>
        <select name="major">
          <option value="Web Development">Web Development</option>
          <option value="Mobile App">Mobile App</option>
          <option value="Design">Design</option>
          <option value="Data Science">Data Science</option>
        </select>
      </div>
      <form>
        <div>
          <caption>
            ឧបករណ៍ដែលអ្នកមាន
          </caption>
          <input type="checkbox" name="laptop" />
          <label for="laptop">កុំព្យូទ័រយួរដៃ</label>
          <input type="checkbox" name="wifi" />
          <label for="wifi">អ៊ីនធឺណិត</label>
          <input type="checkbox" name="smartphone" />
          <label for="smartphone">ស្មាតហ្វូន</label>
        </div>
        <form>
          <div>
            <button type="submit">ចុះឈ្មោះឥឡូវនេះ</button>
          </div>
        </form>
      </form>
    </form>
  </body>
</html>
